name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Jednou týdně obnovit jízdní řády PID.
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Linky PID z GTFS
        continue-on-error: true
        run: |
          mkdir -p /tmp/gtfs
          curl -sSfL -o /tmp/gtfs/pid.zip https://data.pid.cz/PID_GTFS.zip
          unzip -q -o /tmp/gtfs/pid.zip -d /tmp/gtfs
          node scripts/build-pid.mjs /tmp/gtfs public/pid.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
